<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login — Shailputri Agro Foods</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Shailputri Agro Foods Pvt. Ltd.</h1>
    <p>Admin Login</p>
  </header>

  <main>
    <section>
      <h2>Admin Login</h2>
      <input type="text" id="admin-username" placeholder="Admin Username"><br>
      <input type="password" id="admin-password" placeholder="Admin Password"><br>
      <button onclick="adminLogin()">Login</button>
      <p id="admin-message"></p>
    </section>
  </main>

  <script src="admin-login.js"></script>
</body>
</html>
