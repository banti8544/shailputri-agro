<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealer Login - Shailputri Agro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .auth-card {
      background: white;
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #102a43;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }
    .sub-title {
      text-align: center;
      color: #64748b;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      font-weight: bold;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      background: #102a43;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #0088cc;
    }
    .links-row {
      display: flex;
      justify-content: space-between;
      margin-top: 1.2rem;
      font-size: 0.85rem;
    }
    .links-row a {
      color: #0088cc;
      text-decoration: none;
      font-weight: bold;
    }
    .links-row a:hover {
      text-decoration: underline;
    }
    .error-msg {
      color: #c5221f;
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      font-weight: bold;
    }

    /* Modal for Forgot Password */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-box {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>Shailputri Agro Foods</h2>
    <div class="sub-title">B2B Dealer Trade Portal Login</div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required placeholder="e.g. banti1122" value="banti1122">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" value="123456">
      </div>

      <button type="submit">Login to Portal</button>
    </form>

    <div class="links-row">
      <a href="javascript:void(0)" onclick="openForgotModal()">Forgot Password?</a>
      <a href="signup.html">New Dealer? Register</a>
    </div>

    <div id="error-message" class="error-msg"></div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-top:0; color:#102a43;">🔑 Reset Dealer Password</h3>
      <p style="font-size:0.85rem; color:#64748b; margin-bottom: 1rem;">Enter your Username and registered Mobile Number to set a new password.</p>
      
      <form onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <label>Username *</label>
          <input type="text" id="forgot-username" required placeholder="e.g. banti1122">
        </div>

        <div class="form-group">
          <label>Registered Mobile Phone *</label>
          <input type="tel" id="forgot-phone" required placeholder="e.g. 8544241851">
        </div>

        <div class="form-group">
          <label>New Password *</label>
          <input type="password" id="forgot-newpass" required placeholder="Enter new password">
        </div>

        <div style="display:flex; gap:10px; margin-top:1.5rem;">
          <button type="button" onclick="closeForgotModal()" style="background:#cbd5e1; color:#334155;">Cancel</button>
          <button type="submit" style="background:#137333;">Update Password</button>
        </div>
      </form>
      <div id="forgot-status" style="margin-top:0.8rem; font-size:0.85rem; text-align:center; font-weight:bold;"></div>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const err = document.getElementById("error-message");
      err.textContent = "Verifying credentials...";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem("username", data.username);
          localStorage.setItem("businessName", data.businessName);
          localStorage.setItem("phone", data.phone);
          localStorage.setItem("address", data.address);
          localStorage.setItem("state", data.state);
          localStorage.setItem("gstin", data.gstin);
          window.location.href = "index.html";
        } else {
          err.textContent = data.message || "Invalid username or password!";
        }
      } catch (e) {
        err.textContent = "Server error. Ensure node server.js is running.";
      }
    }

    function openForgotModal() {
      document.getElementById("forgot-modal").style.display = "flex";
      document.getElementById("forgot-username").value = document.getElementById("username").value;
      document.getElementById("forgot-status").textContent = "";
    }

    function closeForgotModal() {
      document.getElementById("forgot-modal").style.display = "none";
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const status = document.getElementById("forgot-status");
      status.style.color = "#0369a1";
      status.textContent = "Verifying & updating password...";

      const username = document.getElementById("forgot-username").value.trim();
      const phone = document.getElementById("forgot-phone").value.trim();
      const newPassword = document.getElementById("forgot-newpass").value.trim();

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, phone, newPassword })
        });
        const data = await res.json();

        if (data.success) {
          status.style.color = "#137333";
          status.textContent = data.message;
          setTimeout(() => {
            closeForgotModal();
            document.getElementById("password").value = newPassword;
            alert("Password reset successfully! You can now login.");
          }, 1500);
        } else {
          status.style.color = "#c5221f";
          status.textContent = data.message;
        }
      } catch (err) {
        status.style.color = "#c5221f";
        status.textContent = "Server connection failed.";
      }
    }
  </script>
</body>
</html>
